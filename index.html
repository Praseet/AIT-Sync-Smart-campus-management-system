<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AIT Sync | Student Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              background: "hsl(var(--background))",
              foreground: "hsl(var(--foreground))",
              card: "hsl(var(--card))",
              "card-foreground": "hsl(var(--card-foreground))",
              popover: "hsl(var(--popover))",
              "popover-foreground": "hsl(var(--popover-foreground))",
              primary: "hsl(var(--primary))",
              "primary-foreground": "hsl(var(--primary-foreground))",
              secondary: "hsl(var(--secondary))",
              "secondary-foreground": "hsl(var(--secondary-foreground))",
              muted: "hsl(var(--muted))",
              "muted-foreground": "hsl(var(--muted-foreground))",
              accent: "hsl(var(--accent))",
              "accent-foreground": "hsl(var(--accent-foreground))",
              destructive: "hsl(var(--destructive))",
              "destructive-foreground": "hsl(var(--destructive-foreground))",
              border: "hsl(var(--border))",
              input: "hsl(var(--input))",
              ring: "hsl(var(--ring))",
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            animation: {
              'fade-in': 'fadeIn 0.5s ease-out',
              'slide-up': 'slideUp 0.5s ease-out',
              'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              slideUp: {
                '0%': { transform: 'translateY(10px)', opacity: '0' },
                '100%': { transform: 'translateY(0)', opacity: '1' },
              }
            }
          }
        }
      }
    </script>
    <style type="text/tailwindcss">
      @layer base {
        :root {
          /* Premium Linear/Vercel Dark Theme */
          --background: 230 18% 6%; /* Deep Blue-Black */
          --foreground: 210 20% 98%;
          
          --card: 230 18% 8%; /* Slightly lighter than bg */
          --card-foreground: 210 20% 98%;
          
          --popover: 230 18% 8%;
          --popover-foreground: 210 20% 98%;
          
          /* Electric Violet - High Contrast against dark */
          --primary: 250 95% 64%; 
          --primary-foreground: 210 20% 98%;
          
          --secondary: 230 15% 12%; /* Subtle differentiation */
          --secondary-foreground: 210 20% 98%;
          
          --muted: 230 15% 12%;
          --muted-foreground: 215 20% 65%;
          
          --accent: 230 15% 15%;
          --accent-foreground: 210 20% 98%;
          
          --destructive: 0 84% 60%;
          --destructive-foreground: 210 20% 98%;
          
          --border: 230 15% 14%; /* Subtle borders */
          --input: 230 15% 14%;
          --ring: 250 95% 64%;
          
          --radius: 0.5rem;
        }
        
        .light {
          /* Crisp Paper Light Theme */
          --background: 0 0% 100%;
          --foreground: 230 18% 6%;
          
          --card: 0 0% 100%;
          --card-foreground: 230 18% 6%;
          
          --popover: 0 0% 100%;
          --popover-foreground: 230 18% 6%;
          
          --primary: 250 95% 64%; /* Same Electric Violet for brand consistency */
          --primary-foreground: 210 20% 98%;
          
          --secondary: 220 14% 96%;
          --secondary-foreground: 230 18% 6%;
          
          --muted: 220 14% 96%;
          --muted-foreground: 220 10% 45%;
          
          --accent: 220 14% 96%;
          --accent-foreground: 230 18% 6%;
          
          --destructive: 0 84% 60%;
          --destructive-foreground: 210 20% 98%;
          
          --border: 220 13% 91%;
          --input: 220 13% 91%;
          --ring: 250 95% 64%;
          
          --radius: 0.5rem;
        }
      }
      body {
        @apply bg-background text-foreground antialiased selection:bg-primary/30;
      }
      
      /* Glassmorphism Utilities */
      .glass {
        @apply bg-background/70 backdrop-blur-xl border-b border-border/50;
      }
      
      .glass-sidebar {
        @apply bg-background/40 backdrop-blur-xl border-r border-border/50;
      }

      /* Refined Scrollbar */
      ::-webkit-scrollbar {
        width: 5px;
        height: 5px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        @apply bg-muted-foreground/20 rounded-full hover:bg-muted-foreground/40 transition-colors;
      }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.3.1",
        "react/": "https://esm.sh/react@18.3.1/",
        "react-dom": "https://esm.sh/react-dom@18.3.1",
        "react-dom/": "https://esm.sh/react-dom@18.3.1/",
        "lucide-react": "https://esm.sh/lucide-react@0.363.0?external=react,react-dom",
        "@tanstack/react-query": "https://esm.sh/@tanstack/react-query@5.28.4?external=react,react-dom",
        "zustand": "https://esm.sh/zustand@4.5.2?external=react",
        "clsx": "https://esm.sh/clsx@2.1.0",
        "framer-motion": "https://esm.sh/framer-motion@11.0.14?external=react,react-dom",
        "react-router-dom": "https://esm.sh/react-router-dom@6.22.3?external=react,react-dom",
        "tailwind-merge": "https://esm.sh/tailwind-merge@2.2.2",
        "cmdk": "https://esm.sh/cmdk@1.0.0?external=react,react-dom"
      }
    }
    </script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
